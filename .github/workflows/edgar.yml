name: Pull SEC Form D filings

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (at :17 past, to avoid the top-of-hour rush)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # lets the built-in token save the updated JSON file

concurrency:
  group: edgar
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch Form D filings from the SEC
        run: node scripts/edgar.js
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

      - name: Save the results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edgar-latest.json data/seen-accessions.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Form D data"
            git push
          fi
